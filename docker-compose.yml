---
services:  
  octopus:
    image: repo/octopus-energy-metrics:latest
    environment:
      - OCTO_API_KEY=$OCTO_API_KEY
      - OCTO_ELECTRIC_MPAN=$OCTO_ELECTRIC_MPAN
      - OCTO_ELECTRIC_SN=$OCTO_ELECTRIC_SN
      - OCTO_GAS_MPRN=$OCTO_GAS_MPRN
      - OCTO_GAS_SN=$OCTO_GAS_SN
      - OCTO_GAS_COST=$OCTO_GAS_COST
      - OCTO_ELECTRIC_ENABLED=${OCTO_ELECTRIC_ENABLED:-true}
      - OCTO_ACCOUNT_NUMBER=${OCTO_ACCOUNT_NUMBER:-}
      - OCTO_EXPORT_ENABLED=${OCTO_EXPORT_ENABLED:-false}
      - OCTO_EXPORT_ACCOUNT_NUMBER=${OCTO_EXPORT_ACCOUNT_NUMBER:-}
      - OCTO_EXPORT_MPAN=${OCTO_EXPORT_MPAN:-}
      - OCTO_EXPORT_SN=${OCTO_EXPORT_SN:-}
      - DRY_RUN=${DRY_RUN:-false}
      - OCTO_TIMEOUT_SECONDS=${OCTO_TIMEOUT_SECONDS:-60}
      - INFLUXDB_URL=$INFLUXDB_URL
      - INFLUXDB_TOKEN=$INFLUXDB_TOKEN
      - INFLUXDB_ORG=$INFLUXDB_ORG
      - INFLUXDB_BUCKET=$INFLUXDB_BUCKET
      - LOOP_TIME=$LOOP_TIME
      - PAGE_SIZE=$PAGE_SIZE
      - VOLUME_CORRECTION=$VOLUME_CORRECTION
      - CALORIFIC_VALUE=$CALORIFIC_VALUE
      - JOULES_CONVERSION=$JOULES_CONVERSION
    restart: always 
